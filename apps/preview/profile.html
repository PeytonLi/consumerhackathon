<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Your Nickel player card</title>
<!--PROFILE-->
<link rel="stylesheet" href="/nickel.css">
<style>
  :root { --game: light-dark(#30d158, #30d158); }
  .stage { align-items: center; justify-content: center; gap: var(--s4); }
  .shot { position: relative; width: 148px; height: 148px; border-radius: 50%; border: 0; padding: 0; background: var(--surface); overflow: hidden; display: grid; place-items: center; color: var(--ink-2); font: 600 14px/1.2 var(--font); box-shadow: 0 0 0 4px color-mix(in srgb, var(--game) 55%, transparent); }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shot svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; margin: 0 auto 6px; }
  .fields { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
  .fields label { font: 600 13px/1 var(--font); color: var(--ink-2); padding-left: 4px; }
  .fields input { width: 100%; height: 52px; border-radius: 14px; border: 0; background: var(--surface); padding: 0 16px; font: 500 17px/1 var(--font); color: var(--ink); outline: none; }
  .fields input:focus { box-shadow: 0 0 0 2px var(--game); }
  .done h2 { margin: 0; font: 700 30px/1.1 var(--font); letter-spacing: -0.025em; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div></div>
    <div class="name"><b>Player card</b><span id="league">Nickel</span></div>
    <div></div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="dock" id="dock"></footer>
</div>
<div class="glass toast" id="toast" role="status"></div>
<input type="file" id="file" accept="image/*" capture="user" hidden>
<script>
let P = window.PROFILE;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");
let photo = "";
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1800); }
const CAMERA = '<svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.5-2.5h7L17 8.5h3a1 1 0 0 1 1 1v8.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';

function form() {
  if (!P) { $("stage").innerHTML = '<p class="t-title">This card link is not valid.</p><p class="t-caption">Text "Nickel, set me up" in the group for a new one.</p>'; return; }
  $("stage").className = "stage";
  $("stage").innerHTML =
    '<button class="shot" id="shot" type="button" aria-label="Add your photo">' + (P.face ? '<img src="' + P.face + '" alt="">' : "<span>" + CAMERA + "Add a photo</span>") + "</button>" +
    '<div class="fields"><label for="name">First name</label><input id="name" maxlength="14" autocomplete="given-name" placeholder="Sritej" value="' + esc(P.name || "") + '">' +
    '<label for="account">Payout handle</label><input id="account" maxlength="40" autocapitalize="off" autocorrect="off" placeholder="Venmo or Cash App, like @sritej" value="' + esc(P.account || "") + '"></div>' +
    '<p class="t-caption" style="text-align:center;max-width:300px">One time. After this, every Nickel link on this phone opens as you.</p>';
  $("dock").innerHTML = '<button class="glass primary" id="save" type="button">Save my card</button>';
  $("shot").onclick = () => $("file").click();
  $("save").onclick = save;
}

$("file").onchange = () => {
  const file = $("file").files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const side = Math.min(img.width, img.height), c = document.createElement("canvas");
    c.width = c.height = 256;
    c.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 256, 256);
    photo = c.toDataURL("image/jpeg", 0.78);
    $("shot").innerHTML = '<img src="' + photo + '" alt="">';
    URL.revokeObjectURL(img.src);
  };
  img.onerror = () => toast("That photo did not work. Try another.");
  img.src = URL.createObjectURL(file);
};

async function save() {
  const name = $("name").value.trim();
  if (!name) return toast("Add your first name.");
  $("save").disabled = true;
  const body = { name, account: $("account").value.trim() };
  if (photo) body.photo = photo;
  const res = await (await fetch("/api/me/" + P.token, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })).json().catch(() => ({ ok: false, error: "Nickel is offline." }));
  if (!res.ok) { $("save").disabled = false; return toast(res.error || "Could not save."); }
  P = res.profile;
  $("stage").className = "stage done";
  $("stage").innerHTML = '<span class="shot" style="width:128px;height:128px">' + (P.face ? '<img src="' + P.face + '" alt="">' : esc(P.name[0])) + "</span><h2>You are set, " + esc(P.name) + '.</h2><p class="t-caption" style="text-align:center;max-width:300px">Every game, draft and buy-in link now opens as you. Go back to the chat.</p>';
  $("dock").innerHTML = '<a class="glass primary" href="/l" style="text-decoration:none;display:grid;place-items:center">See the leaderboard</a><button class="glass" id="edit" type="button" style="margin-top:8px">Edit my card</button>';
  $("edit").onclick = form;
}
form();
</script>
</body>
</html>
