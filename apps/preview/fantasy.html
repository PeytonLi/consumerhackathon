<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Nickel Fantasy</title>
<!--LEAGUE-->
<link rel="stylesheet" href="/nickel.css">
<style>
  :root { --game: light-dark(#34c759, #30d158); }
  .stage { justify-content: flex-start; align-items: stretch; overflow-y: auto; gap: var(--s3); padding: var(--s2) 0 var(--s3); -webkit-overflow-scrolling: touch; }
  .stage.center { justify-content: center; align-items: center; }
  .seg { display: flex; flex: none; padding: 3px; border-radius: var(--r-pill); background: var(--surface-2); }
  .seg button { flex: 1; height: 34px; border-radius: var(--r-pill); font: 600 14px/1 var(--font); color: var(--ink-2); transition: background var(--t-lock) var(--ease); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
  .rowi { flex: none; }
  .rowi.tall { height: 64px; }
  .rowi .who { flex: 1; min-width: 0; }
  .rowi .who b { display: block; }
  .rowi .who span { display: block; margin-top: 4px; font: 500 12px/1.2 var(--font); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rowi .avatar { width: 30px; height: 30px; font-size: 13px; }
  .take { height: 32px; padding: 0 14px; border-radius: var(--r-pill); background: var(--you); color: #fff; font: 600 14px/1 var(--font); }
  .take:active { transform: scale(.94); }
  .rowi.mine { box-shadow: inset 0 0 0 2px var(--you); }
  .write { display: flex; gap: var(--s2); }
  .write input { flex: 1; min-width: 0; height: 50px; border: 0; outline: none; border-radius: var(--r-pill); padding: 0 18px; background: var(--surface); font: 500 17px/1 var(--font); -webkit-user-select: text; user-select: text; }
  .write button { width: 96px; height: 50px; flex: none; }
  .people { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 12px; width: 100%; max-width: 320px; }
  .person { display: flex; flex-direction: column; align-items: center; gap: 8px; font: 500 15px/1 var(--font); color: var(--ink-2); }
  .person.on { color: var(--ink); font-weight: 600; }
  .person.on .avatar { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5.5px var(--you); }
  .people.picked .person:not(.on) { opacity: .45; }
  .bumps { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }
  .bumps button { height: 56px; border-radius: 18px; font: 700 20px/1 var(--round); }
  .empty { text-align: center; padding: var(--s5) 0; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div id="me"></div>
    <div class="name"><b id="title"></b><span id="league"></span></div>
    <div><span class="glass pill" id="count" hidden></span></div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="dock" id="dock"></footer>
</div>
<div class="glass toast" id="toast" role="status"></div>
<div class="scrim" id="scrim"></div>
<section class="glass sheet" id="sheet" aria-hidden="true"></section>
<script>
let L = window.LEAGUE;
const params = new URLSearchParams(location.search);
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
const $ = (id) => document.getElementById(id);
const stage = $("stage"), dock = $("dock");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");
const HUES = ["#0a84ff", "#ff9f0a", "#30d158", "#bf5af2", "#ff375f", "#40c8e0", "#5e5ce6"];
const hue = (name) => { const i = L.members.indexOf(name); return HUES[(i < 0 ? [...name].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) : i) % HUES.length]; };
const avatar = (name, cls = "") => '<span class="avatar ' + cls + '" style="--hue:' + hue(name) + '">' + esc(name[0]) + "</span>";
const meKey = "nickel.me." + (params.get("via") ?? "link");
const me = () => (window.ME && window.ME.name) || sessionStorage.getItem(meKey);
let view = "draft";

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), 1600);
}
function closeSheet() { $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); }
$("scrim").onclick = closeSheet;

async function call(action, body) {
  const res = await fetch("/api/fantasy/" + L.id + (action ? "/" + action : ""), body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : undefined);
  const data = await res.json();
  if (data.league) L = data.league;
  if (!data.ok && data.error) toast(data.error);
  return data;
}

function standings() {
  return L.members.map((m) => {
    const picks = L.pool.filter((p) => p.owner === m);
    return { m, picks, points: picks.reduce((s, p) => s + p.points, 0) };
  }).sort((a, b) => b.points - a.points);
}

function pickName() {
  stage.className = "stage center";
  stage.innerHTML = '<p class="t-title">Who\'s drafting?</p><div class="people" id="people">' +
    L.members.map((m) => '<button class="person" type="button" data-name="' + esc(m) + '">' + avatar(m, "lg") + esc(m) + "</button>").join("") + "</div>";
  dock.innerHTML = '<button class="glass primary" id="confirm" type="button" disabled>Pick yourself</button>';
  let picked;
  stage.querySelectorAll(".person").forEach((b) => b.onclick = () => {
    picked = b.dataset.name;
    stage.querySelectorAll(".person").forEach((x) => x.classList.toggle("on", x === b));
    $("people").classList.add("picked");
    $("confirm").disabled = false;
    $("confirm").textContent = "I'm " + picked;
  });
  $("confirm").onclick = () => { sessionStorage.setItem(meKey, picked); draw(); };
}

function scoreSheet(pick) {
  $("sheet").innerHTML = '<p class="t-title">' + esc(pick.name) + '</p><p class="t-label" style="text-align:center;margin-bottom:16px">' + pick.points + " points" + (pick.owner ? " for " + esc(pick.owner) : "") +
    '</p><div class="bumps">' + [1, 5, 10, -5].map((d) => '<button class="fill" type="button" data-d="' + d + '">' + (d > 0 ? "+" : "") + d + "</button>").join("") + "</div>";
  $("sheet").classList.add("on");
  $("scrim").classList.add("on");
  $("sheet").querySelectorAll("[data-d]").forEach((b) => b.onclick = async () => {
    await call("score", { pick: pick.name, delta: Number(b.dataset.d), member: me() });
    closeSheet();
    toast(pick.name + " " + (b.dataset.d > 0 ? "+" : "") + b.dataset.d);
    draw();
  });
}

function draw() {
  if (!L) {
    stage.className = "stage center";
    stage.innerHTML = '<p class="t-title">This league ended</p><p class="t-label">Text Nickel to start a new one</p>';
    dock.hidden = true;
    return;
  }
  $("title").textContent = "Fantasy " + L.topic;
  $("league").textContent = L.league;
  if (!me()) return pickName();
  $("me").innerHTML = avatar(me());
  const mine = L.pool.filter((p) => p.owner === me());
  const full = mine.length >= L.rosterSize;
  $("count").hidden = false;
  $("count").textContent = mine.length + "/" + L.rosterSize;
  stage.className = "stage";
  const seg = '<div class="seg"><button type="button" data-v="draft" class="' + (view === "draft" ? "on" : "") + '">Draft board</button><button type="button" data-v="standings" class="' + (view === "standings" ? "on" : "") + '">Standings</button></div>';
  if (view === "draft") {
    const rows = [...L.pool].sort((a, b) => b.points - a.points).map((p) =>
      '<div class="rowi' + (p.owner === me() ? " mine" : "") + '" data-pick="' + esc(p.name) + '"><b>' + esc(p.name) + '</b><span class="num">' + p.points + "</span>" +
      (p.owner ? avatar(p.owner) : full ? "" : '<button class="take" type="button" data-take="' + esc(p.name) + '">Draft</button>') + "</div>").join("");
    stage.innerHTML = seg + '<div class="rows">' + (rows || '<p class="t-label empty">Nothing on the board yet. Write in your first pick.</p>') + "</div>";
    dock.innerHTML = full
      ? '<p class="t-caption">Roster full. Score from the chat: "Nickel, ' + esc(mine[0].name) + ' +10"</p>'
      : '<form class="write" id="write"><input id="own" placeholder="Write in a pick" maxlength="40" autocomplete="off"><button class="glass primary" type="submit">Draft</button></form>';
  } else {
    stage.innerHTML = seg + '<div class="rows">' + standings().map((s, i) =>
      '<div class="rowi tall' + (s.m === me() ? " me" : "") + '"><span class="rk">' + (i + 1) + "</span>" + avatar(s.m) + '<span class="who"><b>' + esc(s.m) + "</b><span>" + (s.picks.map((p) => esc(p.name)).join(", ") || "No picks yet") + '</span></span><span class="num">' + s.points + "</span></div>").join("") + "</div>";
    dock.innerHTML = '<p class="t-caption">Tap a pick on the draft board to score it</p>';
  }
  dock.hidden = false;
  stage.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => { view = b.dataset.v; draw(); });
  stage.querySelectorAll("[data-take]").forEach((b) => b.onclick = async (e) => { e.stopPropagation(); await call("draft", { member: me(), pick: b.dataset.take }); draw(); });
  stage.querySelectorAll("[data-pick]").forEach((r) => r.onclick = () => scoreSheet(L.pool.find((p) => p.name === r.dataset.pick)));
  const form = $("write");
  if (form) form.onsubmit = async (e) => { e.preventDefault(); const v = $("own").value.trim(); if (v) { await call("draft", { member: me(), pick: v }); draw(); } };
}

draw();
if (L) setInterval(async () => {
  if ($("sheet").classList.contains("on") || document.activeElement === $("own")) return;
  const before = JSON.stringify(L);
  await call("");
  if (JSON.stringify(L) !== before && me()) draw();
}, 4000);
</script>
</body>
</html>
