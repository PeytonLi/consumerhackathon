<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Nickel wallet</title>
<!--WALLET-->
<link rel="stylesheet" href="/nickel.css">
<script src="/mock-api.js"></script>
<style>
  :root { --game: light-dark(#34c759, #30d158); }
  .stage { justify-content: flex-start; align-items: stretch; gap: var(--s3); padding-top: var(--s2); }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: var(--s3) 0 var(--s2); flex: none; }
  .hero .t-display { animation: pop 420ms var(--spring) both; }
  .hero .row { display: flex; gap: var(--s2); align-items: center; min-height: 32px; }
  .tag.low { color: var(--them); background: color-mix(in srgb, var(--them) 14%, transparent); }
  button.tag { height: 32px; padding: 0 12px; color: var(--ink); background: var(--surface); }
  button.tag:active { transform: scale(.96); }
  button.tag:disabled { color: var(--ink-3); }
  .limit { display: flex; align-items: center; gap: var(--s3); height: 60px; padding: 0 var(--s4); text-align: left; flex: none; width: 100%; }
  .limit:active { transform: scale(.98); transition: transform var(--t-press); }
  .limit .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; color: var(--game); background: color-mix(in srgb, var(--game) 14%, transparent); flex: none; }
  .limit .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .limit .meter { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .limit .meter i { display: block; height: 100%; background: var(--game); border-radius: 2px; }
  .limit .num { font: 600 17px/1 var(--round); }
  .limit > .i { color: var(--ink-3); font-size: 16px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; padding: var(--s1) var(--s1) 0; flex: none; }
  .feed { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 6px; padding-bottom: var(--s2); -webkit-mask: linear-gradient(#000 calc(100% - 24px), transparent); mask: linear-gradient(#000 calc(100% - 24px), transparent); }
  .feed .rowi { flex: none; height: 56px; }
  .feed .rowi .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .feed .rowi .txt b { flex: none; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed .rowi .num { font: 600 16px/1 var(--round); color: var(--ink); }
  .feed .rowi .num.plus { color: var(--game); }
  .dir { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; flex: none; background: var(--surface-2); color: var(--ink-2); }
  .dir.plus { color: var(--game); background: color-mix(in srgb, var(--game) 14%, transparent); }
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--ink-3); }
  .empty .i { font-size: 28px; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
  .chip { height: 44px; border-radius: var(--r-pill); background: var(--surface); font: 600 17px/1 var(--round); box-shadow: inset 0 0 0 1px var(--hair); transition: box-shadow var(--t-lock) var(--ease), transform var(--t-press); }
  .chip:active { transform: scale(.95); }
  .chip.on { color: var(--you); box-shadow: inset 0 0 0 2.5px var(--you); }
  .sheet .chip { background: var(--surface-2); box-shadow: none; }
  .sheet .chip.on { background: var(--surface); box-shadow: inset 0 0 0 2.5px var(--you); }
  .sheet .t-body { text-align: center; margin: var(--s5) var(--s2) var(--s2); }
  .sheet .t-caption { text-align: center; }
  .sheet .t-display { text-align: center; }
  .sheet .t-label { text-align: center; margin-top: var(--s2); display: flex; justify-content: center; align-items: center; gap: 6px; }
  .sheet .dock { margin-top: var(--s5); }
  .halo { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 50%; color: var(--ink-3); background: var(--surface); font-size: 40px; }
  .stage.center { justify-content: center; align-items: center; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div id="me"></div>
    <div class="name"><b>Wallet</b><span>Nickel</span></div>
    <div></div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="dock" id="dock"></footer>
</div>
<div class="glass toast" id="toast" role="status"></div>
<div class="scrim" id="scrim"></div>
<section class="glass sheet" id="sheet" aria-hidden="true"></section>
<script src="/nickel.js"></script>
<script>
const AMOUNTS = [100, 500, 1000];
const LIMITS = [100, 200, 500];
const LOW = 100;
let W, amount = 500;
const asked = Number(params.get("add"));
if (Number.isInteger(asked) && asked >= 100 && asked <= 50000) {
  amount = asked;
  if (!AMOUNTS.includes(asked)) {
    const near = AMOUNTS.reduce((a, b) => (Math.abs(b - asked) < Math.abs(a - asked) ? b : a));
    AMOUNTS.splice(AMOUNTS.indexOf(near), 1, asked);
    AMOUNTS.sort((a, b) => a - b);
  }
}
const back = params.get("back");
if (back && /^\/[a-z0-9/-]*$/i.test(back)) sessionStorage.setItem("nickel.back", back);
let cashoutAsked = params.has("cashout");

const dollars = (c) => "$" + (c / 100).toFixed(2);
const ago = (at) => {
  const m = Math.max(0, Math.round((Date.now() - at) / 60000));
  if (m < 1) return "Now";
  if (m < 60) return m + "m ago";
  if (m < 1440) return Math.round(m / 60) + "h ago";
  return m < 2880 ? "Yesterday" : new Date(at).toLocaleDateString(undefined, { month: "short", day: "numeric" });
};
const LABELS = {
  topup: () => "Added money",
  stake: (n) => (n ? n + " stake" : "Stake"),
  steal: (n, c) => (c > 0 ? "Steal from " : "Stolen by ") + (n || "someone"),
  chest: () => "Chest",
  buyin: () => "Buy-in",
  cashout: () => "Cash out",
  win: (n) => n || "Pot win",
  refund: () => "Refund",
  round: (n) => n || "Game",
  bet: (n) => (n ? "Bet on " + n : "Bet"),
  bounty: (n) => (n ? "Bounty on " + n : "Bounty"),
  play_to_keep: () => "Kept your nickel",
  adjustment: () => "Adjustment",
};
const label = (a) => (LABELS[a.reason] ?? ((n) => n || a.reason))(a.note, a.amountCents);
const sub = (a) => ago(a.at) + (a.reason === "buyin" && a.note ? " \u00b7 " + a.note : "");

async function load() {
  try { W = await api("/api/wallet"); } catch { stage.className = "stage center"; return nowhere("Wallet not found", "Open it from your Nickel link"); }
  draw();
  if (cashoutAsked && W.balanceCents) cashoutSheet();
  cashoutAsked = false;
}

function draw() {
  stage.className = "stage";
  const low = W.balanceCents < LOW && W.activity.length > 0;
  const used = Math.min(100, W.dailyLimitCents ? (W.spentTodayCents / W.dailyLimitCents) * 100 : 0);
  show(
    '<section class="hero"><p class="t-label">Balance</p><p class="t-display" id="bal">' + dollars(W.balanceCents) + "</p>" +
      '<div class="row">' + (low ? '<span class="tag low">' + icon("alert") + "Low</span>" : "") +
      '<button class="tag" id="out" type="button"' + (W.balanceCents ? "" : " disabled") + ">" + icon("bank") + "Cash out</button></div></section>" +
    '<button class="card limit" id="limit" type="button"><span class="ico">' + icon("gauge") + '</span><span class="txt"><b class="t-head">Daily limit</b>' +
      (W.consent ? '<span class="t-caption">' + cash(W.spentTodayCents) + " used today</span>" + '<span class="meter"><i style="width:' + used + '%"></i></span>' : '<span class="t-caption">Not set</span>') +
      "</span>" + (W.consent ? '<span class="num">' + cash(W.dailyLimitCents) + "</span>" : "") + icon("chevron") + "</button>" +
    '<div class="head"><p class="t-label">Activity</p></div>' +
    (W.activity.length
      ? '<div class="feed">' + W.activity.map((a, i) => {
          const plus = a.amountCents > 0 ? " plus" : "";
          return '<div class="rowi" style="animation-delay:' + i * 50 + 'ms"><span class="dir' + plus + '">' + icon(plus ? "in" : "out") + '</span><span class="txt"><b>' + esc(label(a)) + '</b><span class="t-caption">' + esc(sub(a)) + '</span></span><span class="num' + plus + '">' + signed(a.amountCents) + "</span></div>";
        }).join("") + "</div>"
      : '<div class="empty">' + icon("coin") + '<p class="t-label">No activity yet</p></div>'),
    '<div class="chips" id="chips">' + AMOUNTS.map((c) => '<button class="chip' + (c === amount ? " on" : "") + '" type="button" data-c="' + c + '">' + cash(c) + "</button>").join("") + "</div>" +
    '<button class="glass primary" id="add" type="button">' + icon("plus") + "Add " + cash(amount) + "</button>"
  );
  $("chips").onclick = (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    amount = Number(b.dataset.c);
    $("chips").querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === b));
    $("add").innerHTML = icon("plus") + "Add " + cash(amount);
    haptic();
  };
  $("add").onclick = () => (W.consent ? topup() : limitSheet(topup));
  $("limit").onclick = () => limitSheet();
  $("out").onclick = cashoutSheet;
}

async function topup() {
  haptic();
  $("add").disabled = true;
  try {
    const { checkoutUrl } = await api("/api/wallet/topup", { amountCents: amount });
    location.assign(checkoutUrl);
  } catch (err) {
    toast(err.message);
    $("add").disabled = false;
  }
}

function limitSheet(then) {
  let pick = W.consent && LIMITS.includes(W.dailyLimitCents) ? W.dailyLimitCents : LIMITS[0];
  const line = () => "Nickel can use up to <b>" + cash(pick) + "</b> a day for games you join.";
  openSheet(
    '<p class="t-title">Daily limit</p><div class="chips" id="lim">' + LIMITS.map((c) => '<button class="chip' + (c === pick ? " on" : "") + '" type="button" data-c="' + c + '">' + cash(c) + "</button>").join("") + "</div>" +
    '<p class="t-body" id="line">' + line() + '</p><p class="t-caption">Anything more asks you first</p>' +
    '<div class="dock"><button class="primary" id="allow" type="button">' + (W.consent ? "Save" : "Allow") + '</button><button class="secondary fill" type="button" data-close>Not now</button></div>'
  );
  $("lim").onclick = (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    pick = Number(b.dataset.c);
    $("lim").querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === b));
    $("line").innerHTML = line();
    haptic();
  };
  $("allow").onclick = async () => {
    $("allow").disabled = true;
    try {
      await api("/api/wallet/limit", { dailyLimitCents: pick, consent: true });
      Object.assign(W, { dailyLimitCents: pick, consent: true });
      haptic(2);
      closeSheet();
      draw();
      if (then) then();
      else toast(cash(pick) + " a day");
    } catch (err) {
      toast(err.message);
      $("allow").disabled = false;
    }
  };
}

function cashoutSheet() {
  haptic();
  const note = { verified: [icon("check"), "To your Whop wallet"], pending: [icon("clock"), "ID check in progress"] }[W.kyc] ?? [icon("lock"), "Whop checks your ID first"];
  openSheet(
    '<p class="t-title">Cash out</p><p class="t-display">' + dollars(W.balanceCents) + '</p><p class="t-label">' + note.join("") + "</p>" +
    '<div class="dock"><button class="primary" id="go" type="button">' + icon("bank") + 'Cash out</button><button class="secondary fill" type="button" data-close>Cancel</button></div>'
  );
  $("go").onclick = async () => {
    $("go").disabled = true;
    try {
      const res = await api("/api/wallet/cashout", { amountCents: W.balanceCents });
      if (res.url) return location.assign(res.url);
      haptic(2);
      closeSheet();
      toast("On its way");
      load();
    } catch (err) {
      toast(err.message);
      $("go").disabled = false;
    }
  };
}

setMe();
load();
if (params.has("paid")) {
  toast("Payment sent");
  setTimeout(async () => {
    await load();
    const to = sessionStorage.getItem("nickel.back");
    if (!to) return;
    sessionStorage.removeItem("nickel.back");
    location.assign(to);
  }, 3000);
}
</script>
</body>
</html>
