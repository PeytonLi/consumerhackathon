<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>Nickel</title>
<!--ROUND-->
<style>
  :root {
    --obs: #0b0d11;
    --panel: #151920;
    --panel-2: #1d222c;
    --mint: #5dffc0;
    --mint-dim: rgba(93, 255, 192, .14);
    --ink: #f4f6f8;
    --muted: #9aa3b2;
    --orange: #ff8a3d;
    --blue: #7eb6ff;
    --absent: #3a3d46;
    --line: rgba(255, 255, 255, .08);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--obs); color: var(--ink); overscroll-behavior: none; }
  body { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; padding: 0; cursor: pointer; }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    overflow: hidden;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 10px; }
  .top small { display: block; font-size: 12px; color: var(--muted); }
  .top b { display: block; font-size: 19px; font-weight: 650; letter-spacing: -0.03em; margin-top: 1px; }
  .clock {
    font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600;
    color: var(--mint); background: var(--mint-dim); border-radius: 99px; padding: 6px 10px;
  }
  .clock.warn { color: #1a1008; background: var(--orange); }
  .who { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .who b { color: var(--ink); font-weight: 600; }

  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .grow { flex: 1; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; min-height: 18px; margin: 10px 0 0; }
  .foot { padding: 12px 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .primary {
    width: 100%; height: 52px; border-radius: 14px;
    background: var(--mint); color: #06281c; font-size: 17px; font-weight: 650;
  }
  .primary:disabled { background: var(--panel-2); color: var(--muted); }
  .secondary {
    width: 100%; height: 48px; border-radius: 14px;
    background: var(--panel); color: var(--ink); font-size: 16px; font-weight: 600;
    border: 0.5px solid var(--line);
  }

  .board { display: grid; gap: 6px; width: min(100%, 330px, calc((100vh - 320px) * 5 / 6)); margin: 6px auto 0; }
  .guess { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tile {
    aspect-ratio: 1; border-radius: 8px; border: 1.5px solid #2a2f3a;
    display: grid; place-items: center; position: relative;
    font-size: 26px; font-weight: 700; text-transform: uppercase;
    transition: transform .15s, background .2s, border-color .2s;
  }
  .tile.fill { border-color: #5c6574; transform: scale(1.04); }
  .tile.ok { background: var(--orange); border-color: var(--orange); color: #1a1008; }
  .tile.mid { background: var(--blue); border-color: var(--blue); color: #102033; }
  .tile.no { background: var(--absent); border-color: var(--absent); color: #d7dbe2; }
  .tile.ok::after, .tile.mid::after { position: absolute; right: 4px; bottom: 2px; font-size: 10px; font-weight: 800; }
  .tile.ok::after { content: "✓"; }
  .tile.mid::after { content: "•"; font-size: 14px; bottom: 0; }
  .keys { margin-top: auto; padding: 8px 0 10px; }
  .krow { display: flex; gap: 5px; justify-content: center; margin-bottom: 7px; }
  .key {
    height: 46px; flex: 1; max-width: 36px; border-radius: 6px;
    background: #2c3038; font-size: 15px; font-weight: 600; text-transform: uppercase;
  }
  .key.wide { max-width: 58px; flex: 1.6; font-size: 12px; }
  .key.ok { background: var(--orange); color: #1a1008; }
  .key.mid { background: var(--blue); color: #102033; }
  .key.no { background: #191c22; color: #5d6572; }
  .key:active, .choice:active, .chip:active { filter: brightness(1.3); }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--panel); border: 0.5px solid var(--line); border-radius: 14px; padding: 12px 14px;
    opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s;
  }
  .row.in { opacity: 1; transform: none; }
  .row.me { box-shadow: inset 0 0 0 1.5px var(--mint); }
  .row b { font-size: 16px; font-weight: 600; }
  .row span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rank { width: 24px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
  .shareline {
    margin-top: 14px; background: var(--panel); border-radius: 14px; padding: 12px 14px;
    font-size: 14px; line-height: 1.4; color: var(--muted); white-space: pre-line;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .status { font-size: 13px; color: var(--muted); text-align: center; margin: 4px 0 0; }

  .prompt { font-size: 26px; line-height: 1.15; letter-spacing: -0.035em; font-weight: 700; margin: 18px 0 6px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .answer {
    width: 100%; height: 56px; margin-top: 18px; border-radius: 14px;
    border: 0.5px solid var(--line); background: var(--panel);
    padding: 0 16px; font-size: 18px; color: var(--ink); -webkit-user-select: text; user-select: text;
  }
  .answer:focus { outline: 2px solid var(--mint); outline-offset: 0; }
  .depth { margin-top: 24px; display: flex; gap: 14px; align-items: stretch; }
  .gauge { width: 14px; border-radius: 99px; background: var(--panel-2); position: relative; overflow: hidden; height: 220px; }
  .gauge span { position: absolute; left: 0; right: 0; top: 0; height: 0; background: linear-gradient(var(--mint), #1e8f6a); transition: height 1.1s cubic-bezier(.2, .8, .2, 1); }
  .tiers { display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 2px 0; }
  .tiers .hit { color: var(--mint); font-weight: 650; }
  .big { font-size: 40px; font-weight: 750; letter-spacing: -0.04em; margin: 0; font-variant-numeric: tabular-nums; }

  .vs { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 4px; }
  .vs div { text-align: center; flex: 1; }
  .vs b { display: block; font-size: 15px; }
  .vs span { font-size: 34px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .vs i { color: var(--muted); font-style: normal; font-size: 13px; }
  .arena { display: flex; justify-content: center; gap: 28px; margin: 22px 0 6px; min-height: 108px; align-items: center; }
  .hand {
    width: 96px; height: 96px; border-radius: 24px; background: var(--panel);
    display: grid; place-items: center; font-size: 46px; border: 0.5px solid var(--line);
    transition: transform .3s;
  }
  .hand.flip { animation: flip .45s; }
  @keyframes flip { 0% { transform: rotateY(90deg); } 100% { transform: none; } }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; padding-bottom: 16px; }
  .choice {
    height: 112px; border-radius: 18px; background: var(--panel); border: 0.5px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .choice em { font-size: 40px; font-style: normal; }
  .choice small { font-size: 13px; color: var(--muted); font-weight: 600; }
  .choice:disabled { opacity: .45; }

  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    height: 44px; padding: 0 16px; border-radius: 99px; background: var(--panel);
    border: 0.5px solid var(--line); font-size: 16px; font-weight: 600;
  }
  .chip.on { background: var(--mint); color: #06281c; border-color: var(--mint); }
  .pill {
    align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--mint); background: var(--mint-dim); padding: 4px 9px; border-radius: 99px;
  }
  .pill.gray { color: var(--muted); background: var(--panel-2); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div><small id="league"></small><b id="title"></b></div>
    <div class="clock" id="clock" hidden></div>
  </header>
  <p class="who" id="who" hidden></p>
  <main class="screen" id="screen"></main>
</div>
<script>
const R = window.ROUND ?? { game: "missing", title: "Nickel" };
const params = new URLSearchParams(location.search);
const via = params.get("via") ?? "link";
const screen = document.getElementById("screen");
const clockEl = document.getElementById("clock");
document.getElementById("league").textContent = R.league ?? "Nickel";
document.getElementById("title").textContent = R.number ? R.title + " #" + R.number : R.title;

const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const fmt = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const tell = (line) => { if (parent !== window) parent.postMessage({ type: "nickel:done", round: R.id, line }, "*"); };
const meKey = "nickel.me." + via;
const me = () => sessionStorage.getItem(meKey);

let timer;
function countdown(seconds, onEnd) {
  let left = seconds;
  clockEl.hidden = false;
  clockEl.textContent = fmt(left);
  clearInterval(timer);
  timer = setInterval(() => {
    left = Math.max(0, left - 1);
    clockEl.textContent = fmt(left);
    clockEl.classList.toggle("warn", left <= 10);
    if (left === 0) { clearInterval(timer); onEnd(); }
  }, 1000);
  return () => seconds - left;
}
function stopClock(text) { clearInterval(timer); clockEl.classList.remove("warn"); clockEl.textContent = text; }

function showWho() {
  const el = document.getElementById("who");
  el.hidden = false;
  el.innerHTML = "Playing as <b>" + me() + "</b>" + (via === "vault" ? " · verified by Keiki Vault" : "");
}

function start() {
  if (R.game === "missing") return missing();
  if (via === "vault") sessionStorage.setItem(meKey, "Peyton");
  if (!me()) return pickName();
  showWho();
  if (R.closed && !params.has("practice")) return closed();
  ({ wordle, krillion, rps })[R.game]();
}

function pickName() {
  screen.replaceChildren(h(`
    <section class="center">
      <span class="pill">First time only</span>
      <p class="prompt">Which one are you?</p>
      <p class="sub">Nickel checks it with one text from your phone, then never asks again.</p>
      <div class="chips">${R.members.map((m) => '<button class="chip" type="button">' + m + "</button>").join("")}</div>
      <div class="foot" style="margin-top:18px"><button class="primary" id="confirm" type="button" disabled>Text Nickel to confirm</button></div>
    </section>`));
  let picked;
  screen.querySelectorAll(".chip").forEach((chip) => chip.onclick = () => {
    screen.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === chip));
    picked = chip.textContent;
    const btn = document.getElementById("confirm");
    btn.disabled = false;
    btn.textContent = "I'm " + picked + " · text Nickel to confirm";
  });
  document.getElementById("confirm").onclick = (e) => {
    e.target.disabled = true;
    e.target.textContent = "Confirmed ✓";
    sessionStorage.setItem(meKey, picked);
    setTimeout(start, 650);
  };
}

function missing() {
  screen.replaceChildren(h(`
    <section class="center">
      <span class="pill gray">Card expired</span>
      <p class="prompt">This game isn't open anymore.</p>
      <p class="sub">Text Nickel "today" and it'll send today's game.</p>
    </section>`));
}

function closed() {
  screen.replaceChildren(h(`
    <section class="center">
      <span class="pill gray">Closed ${R.closedAt}</span>
      <p class="prompt">${R.prompt}</p>
      <p class="sub">${R.result}</p>
      <div class="foot" style="margin-top:22px">
        <button class="primary" id="today" type="button">Play today's game</button>
        <button class="secondary" id="practice" type="button">Practice this one</button>
      </div>
    </section>`));
  document.getElementById("today").onclick = () => location.href = "/r/" + R.next + location.search;
  document.getElementById("practice").onclick = () => location.href = location.pathname + "?" + new URLSearchParams({ via, practice: "1" });
}

function reveal(rows, mine, line) {
  const list = h('<div class="list"></div>');
  screen.replaceChildren(
    h('<p class="status" id="st">Round closes ' + R.closes + ' · ' + (R.played.length + 1) + " of " + R.members.length + " played</p>"),
    list,
    h('<div class="shareline">' + line + "</div>"),
    h('<div class="grow"></div>'),
    h('<div class="foot"><button class="primary" id="copy" type="button">Copy result</button></div>')
  );
  const all = [...rows, mine].sort((a, b) => a[3] - b[3]);
  all.reverse().forEach((r, i) => setTimeout(() => {
    const el = h('<div class="row' + (r === mine ? " me" : "") + '"><div style="display:flex;align-items:center;gap:8px"><span class="rank">' + (all.length - i) + '</span><b>' + r[0] + "</b></div><span>" + r[1] + " · " + r[2] + "</span></div>");
    list.prepend(el);
    requestAnimationFrame(() => el.classList.add("in"));
  }, 450 * i));
  document.getElementById("copy").onclick = async (e) => {
    try { await navigator.clipboard.writeText(line); e.target.textContent = "Copied"; } catch { e.target.textContent = "Copy failed"; }
  };
}

function wordle() {
  const rowsN = 6;
  let guess = "", turn = 0, locked = false, elapsed;
  screen.replaceChildren(
    h('<div class="board" id="board"></div>'),
    h('<p class="hint" id="hint">45 seconds starts on your first letter.</p>'),
    h('<div class="keys" id="keys"></div>')
  );
  const board = document.getElementById("board");
  for (let r = 0; r < rowsN; r++) {
    const g = h('<div class="guess"></div>');
    for (let c = 0; c < 5; c++) g.append(h('<div class="tile" id="t' + r + c + '"></div>'));
    board.append(g);
  }
  clockEl.hidden = false;
  clockEl.textContent = fmt(R.seconds);
  const keys = document.getElementById("keys");
  ["qwertyuiop", "asdfghjkl", "+zxcvbnm-"].forEach((row) => {
    const line = h('<div class="krow"></div>');
    for (const ch of row) {
      const id = ch === "+" ? "enter" : ch === "-" ? "del" : ch;
      const b = h('<button class="key' + (id.length > 1 ? " wide" : "") + '" type="button" data-k="' + id + '">' + (id === "del" ? "⌫" : id) + "</button>");
      b.onclick = () => press(id);
      line.append(b);
    }
    keys.append(line);
  });
  const tile = (r, c) => document.getElementById("t" + r + c);
  function paint() { for (let c = 0; c < 5; c++) { const t = tile(turn, c); t.textContent = guess[c] ?? ""; t.classList.toggle("fill", !!guess[c]); } }
  function score(g) {
    const res = Array(5).fill("no"), left = {};
    for (const ch of R.answer) left[ch] = (left[ch] ?? 0) + 1;
    for (let i = 0; i < 5; i++) if (g[i] === R.answer[i]) { res[i] = "ok"; left[g[i]]--; }
    for (let i = 0; i < 5; i++) if (res[i] !== "ok" && left[g[i]] > 0) { res[i] = "mid"; left[g[i]]--; }
    return res;
  }
  function markKey(ch, cls) {
    const el = keys.querySelector('[data-k="' + ch + '"]');
    const rank = { no: 0, mid: 1, ok: 2 };
    const cur = ["ok", "mid", "no"].find((c) => el.classList.contains(c));
    if (cur && rank[cur] >= rank[cls]) return;
    el.classList.remove("ok", "mid", "no");
    el.classList.add(cls);
  }
  function press(id) {
    if (locked) return;
    if (!elapsed) {
      elapsed = countdown(R.seconds, () => finish(false));
      document.getElementById("hint").textContent = "✓ right spot · • in the word";
    }
    if (id === "del") { guess = guess.slice(0, -1); return paint(); }
    if (id === "enter") return submit();
    if (guess.length < 5) { guess += id; paint(); }
  }
  function submit() {
    if (guess.length < 5) {
      board.children[turn].classList.add("shake");
      setTimeout(() => board.children[turn].classList.remove("shake"), 320);
      document.getElementById("hint").textContent = "Five letters.";
      return;
    }
    const row = turn, word = guess;
    score(word).forEach((cls, c) => setTimeout(() => { const t = tile(row, c); t.classList.remove("fill"); t.classList.add(cls); markKey(word[c], cls); }, 110 * c));
    const won = word === R.answer;
    turn++;
    guess = "";
    if (won || turn === rowsN) { locked = true; setTimeout(() => finish(won), 700); }
  }
  function finish(won) {
    locked = true;
    const secs = elapsed ? elapsed() : R.seconds;
    stopClock("Locked in ✓");
    const tries = won ? turn + "/6" : "X/6";
    const grid = [...board.children].slice(0, turn).map((g) => [...g.children].map((t) => t.classList.contains("ok") ? "🟧" : t.classList.contains("mid") ? "🟦" : "⬛").join("")).join("\n");
    const line = "Nickel Wordle #" + R.number + " · " + tries + " · " + fmt(secs) + "\n" + grid;
    const rows = R.board.map(([n, t, s]) => [n, t, s, (t.startsWith("X") ? 9 : parseInt(t)) * 100 + parseInt(s.split(":")[1])]);
    reveal(rows, [me(), tries, fmt(secs), (won ? turn : 9) * 100 + secs], line);
    tell({ name: me(), tries, time: fmt(secs) });
  }
}

function krillion() {
  const practice = params.has("practice");
  const tiers = [["Wipeout", 0], ["Plankton", 100], ["Schooler", 300], ["Rare", 600], ["Deep Cut", 850], ["One in a Krillion", 1000]];
  const grade = { peru: 1, cuba: 1, iran: 2, iraq: 2, chad: 2, mali: 3, oman: 3, fiji: 3, laos: 4, togo: 4, niue: 5 };
  screen.replaceChildren(h(`
    <section class="screen">
      ${practice ? '<span class="pill gray">Practice · doesn\'t count</span>' : ""}
      <p class="prompt">${R.prompt}</p>
      <p class="sub">Name the rarest one you can. Nobody sees it until the reveal.</p>
      <div class="grow"></div>
      <div class="foot"><button class="primary" id="go" type="button">Start · 25 seconds</button></div>
    </section>`));
  document.getElementById("go").onclick = () => {
    screen.replaceChildren(h(`
      <section class="screen">
        <p class="prompt">${R.prompt}</p>
        <input class="answer" id="ans" placeholder="One answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
        <p class="hint" id="kh">Rarer answers dive deeper.</p>
        <div class="grow"></div>
        <div class="foot"><button class="primary" id="send" type="button">Lock it in</button></div>
      </section>`));
    const input = document.getElementById("ans");
    input.focus({ preventScroll: true });
    const elapsed = countdown(R.seconds, () => submit());
    const submit = () => {
      const raw = input.value.trim().toLowerCase();
      const tier = tiers[raw ? (grade[raw] ?? 0) : 0];
      input.blur();
      stopClock("Locked in ✓");
      const pct = tier[1] / 10;
      screen.replaceChildren(h(`
        <section class="screen">
          <span class="pill">${practice ? "Practice" : "Locked in"} · ${fmt(elapsed())}</span>
          <div class="depth">
            <div class="gauge"><span id="fill"></span></div>
            <div class="tiers">${[...tiers].reverse().map(([n, d]) => '<div class="' + (n === tier[0] ? "hit" : "") + '">' + n + " · " + d + "m</div>").join("")}</div>
          </div>
          <p class="big" id="m">0m</p>
          <p class="sub">"${input.value.trim() || "—"}" · ${tier[0]}</p>
          <div class="grow"></div>
          <div class="foot"><button class="secondary" id="again" type="button">${practice ? "Try another answer" : "Done"}</button></div>
        </section>`));
      requestAnimationFrame(() => { document.getElementById("fill").style.height = pct + "%"; });
      let n = 0;
      const step = setInterval(() => { n = Math.min(tier[1], n + Math.ceil(tier[1] / 24) || tier[1]); document.getElementById("m").textContent = n + "m"; if (n >= tier[1]) clearInterval(step); }, 40);
      document.getElementById("again").onclick = () => practice ? krillion() : tell(null);
    };
    document.getElementById("send").onclick = submit;
    input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
  };
}

function rps() {
  const icons = { rock: "🪨", paper: "📄", scissors: "✂️" };
  const beats = { rock: "scissors", paper: "rock", scissors: "paper" };
  const need = Math.ceil(R.bestOf / 2);
  let mine = 0, theirs = 0, round = 0, busy = false;
  clockEl.hidden = false;
  clockEl.textContent = "until " + R.closes;
  screen.replaceChildren(h(`
    <section class="screen">
      <div class="vs">
        <div><b>${me()}</b><span id="sm">0</span></div>
        <i>best of ${R.bestOf} · ${R.stake} Nickels</i>
        <div><b>${R.opponent}</b><span id="st">0</span></div>
      </div>
      <div class="arena"><div class="hand" id="hm">?</div><div class="hand" id="ht">?</div></div>
      <p class="hint" id="rh">Pick one. ${R.opponent} already locked in.</p>
      <div class="choices">
        ${Object.keys(icons).map((k) => '<button class="choice" type="button" data-m="' + k + '"><em>' + icons[k] + "</em><small>" + k + "</small></button>").join("")}
      </div>
    </section>`));
  screen.querySelectorAll(".choice").forEach((b) => b.onclick = () => play(b.dataset.m));
  function play(m) {
    if (busy) return;
    busy = true;
    screen.querySelectorAll(".choice").forEach((b) => b.disabled = true);
    const t = R.devMoves[round++ % R.devMoves.length];
    const hm = document.getElementById("hm"), ht = document.getElementById("ht");
    hm.textContent = icons[m];
    ht.textContent = "…";
    document.getElementById("rh").textContent = "Locked in. Revealing…";
    setTimeout(() => {
      ht.textContent = icons[t];
      [hm, ht].forEach((x) => { x.classList.remove("flip"); void x.offsetWidth; x.classList.add("flip"); });
      let msg = "Tie. Go again.";
      if (beats[m] === t) { mine++; msg = icons[m] + " beats " + icons[t] + ". Point to you."; }
      else if (beats[t] === m) { theirs++; msg = icons[t] + " beats " + icons[m] + ". Point to " + R.opponent + "."; }
      document.getElementById("sm").textContent = mine;
      document.getElementById("st").textContent = theirs;
      document.getElementById("rh").textContent = msg;
      if (mine === need || theirs === need) return setTimeout(done, 900);
      busy = false;
      screen.querySelectorAll(".choice").forEach((b) => b.disabled = false);
    }, 700);
  }
  function done() {
    const won = mine > theirs;
    stopClock("Final");
    document.getElementById("rh").textContent = won ? "You won " + mine + "–" + theirs + ". +" + R.stake + " Nickels." : R.opponent + " won " + theirs + "–" + mine + ".";
    screen.querySelector(".choices").replaceWith(h('<div class="foot" style="margin-top:auto"><button class="primary" id="rm" type="button">Rematch ' + R.opponent + "</button></div>"));
    document.getElementById("rm").onclick = () => { document.getElementById("rm").textContent = "Sent to " + R.opponent; document.getElementById("rm").disabled = true; };
    tell({ name: me(), opponent: R.opponent, score: won ? mine + "–" + theirs : theirs + "–" + mine, won });
  }
}

start();
</script>
</body>
</html>
