<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Nickel leaderboard</title>
<!--BOARD-->
<link rel="stylesheet" href="/nickel.css">
<style>
  :root { --game: light-dark(#ff9500, #ff9f0a); }
  .app { padding-left: 0; padding-right: 0; }
  .bar { padding: 0 var(--gutter); }
  .stage { justify-content: center; align-items: stretch; gap: var(--s3); }
  .reel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 9vw 12px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .reel::-webkit-scrollbar { display: none; }
  .slide {
    flex: none; width: 82vw; max-width: 340px; scroll-snap-align: center; border-radius: var(--r-big); background: var(--surface);
    padding: var(--s5) var(--s5) var(--s4); display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; overflow: hidden;
    transition: transform var(--t-sheet) var(--ease), opacity var(--t-sheet) var(--ease);
  }
  .slide::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 120px; background: linear-gradient(color-mix(in srgb, var(--hue) 26%, transparent), transparent); }
  .slide > * { position: relative; }
  .slide .rank { align-self: flex-start; font: 700 15px/1 var(--round); color: var(--ink-2); }
  .slide .avatar.xl { width: 96px; height: 96px; font-size: 40px; box-shadow: 0 0 0 4px var(--surface); }
  .mug { position: relative; width: 108px; height: 108px; margin-top: 26px; }
  .mug .pic { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: var(--hue); box-shadow: 0 0 0 4px var(--surface); }
  .mug .pic img, .mug .pic svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mug .prop { position: absolute; left: 50%; pointer-events: none; }
  .mug .crown { width: 62px; top: -30px; transform: translateX(-50%) rotate(-8deg); }
  .mug .cone { width: 54px; top: -44px; transform: translateX(-30%) rotate(14deg); }
  .mug .nose { position: absolute; left: 50%; top: 56%; width: 24px; height: 24px; margin: -12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a80, #ff3b30 60%); box-shadow: 0 2px 4px rgb(0 0 0 / .25); }
  .mug.last .pic { transform: rotate(-7deg); filter: saturate(.6); }
  .slide.shot { padding: 0; width: 84vw; max-width: 380px; background: none; }
  .slide.shot::before { display: none; }
  .slide.shot img { display: block; width: 100%; aspect-ratio: 1; border-radius: var(--r-big); }
  .slide h2 { margin: 4px 0 0; font: 700 28px/1.1 var(--font); letter-spacing: -0.025em; }
  .slide .big { font: 700 56px/1 var(--round); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .slide .big small { font: 600 15px/1 var(--font); color: var(--ink-2); letter-spacing: 0; margin-left: 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-top: 8px; }
  .stat { padding: 12px 4px; text-align: center; background: var(--bg); border-radius: 14px; }
  .stat b { display: block; font: 700 20px/1.1 var(--round); }
  .stat span { display: block; margin-top: 5px; font: 500 12px/1 var(--font); color: var(--ink-2); }
  .last { font: 500 13px/1.35 var(--font); color: var(--ink-2); text-align: center; min-height: 36px; text-wrap: balance; }
  .doom { width: 100%; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--them) 14%, transparent); font: 600 13px/1.35 var(--font); text-align: center; text-wrap: balance; }
  .dots { display: flex; justify-content: center; gap: 6px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); opacity: .45; transition: opacity var(--t-lock), transform var(--t-lock); }
  .dots i.on { opacity: 1; background: var(--ink); transform: scale(1.25); }
  .dock { padding-left: var(--gutter); padding-right: var(--gutter); }
  .reel { padding-bottom: 28px; }
  .slide.shot { overflow: visible; transition: none; scroll-snap-stop: always; transform: scale(calc(1 - var(--a, 0) * .08)); opacity: calc(1 - var(--a, 0) * .3); }
  .shot .lift { position: relative; overflow: hidden; border-radius: var(--r-big); box-shadow: 0 10px 24px rgb(0 0 0 / .14); }
  .shot .lift img { transform: translateX(calc(var(--d, 0) * -18px)) scale(1.07); }
  .shot.revealed .lift { animation: pop 520ms var(--spring) both; }
  .move { position: absolute; right: 7%; top: 15%; display: inline-flex; align-items: center; gap: 3px; height: 26px; padding: 0 9px 0 7px; border-radius: var(--r-pill); color: #fff; font: 700 13px/1 var(--round); background: #34c759; animation: pop 420ms var(--spring) 300ms both; }
  .move.down { background: #ff3b30; }
  .move svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .veil { position: absolute; inset: 0; z-index: 1; border-radius: var(--r-big); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(90% 60% at 50% 30%, color-mix(in srgb, #ffd60a 34%, var(--surface)), var(--surface)); }
  .veil svg { width: 96px; animation: nudge 900ms var(--ease) infinite; }
  .veil.off { pointer-events: none; animation: unveil 520ms var(--ease) forwards; }
  @keyframes unveil { to { opacity: 0; transform: scale(1.14); } }
  .acts { display: grid; grid-template-columns: 1fr auto; gap: var(--s2); }
  .acts .secondary { width: auto; height: 56px; padding: 0 22px; text-decoration: none; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div></div>
    <div class="name"><b>Leaderboard</b><span id="league"></span></div>
    <div></div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="dock" id="dock"></footer>
</div>
<script src="/juice.js"></script>
<script>
let B = window.BOARD;
const params = new URLSearchParams(location.search);
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");
const HUES = ["#0a84ff", "#ff9f0a", "#30d158", "#bf5af2", "#ff375f", "#40c8e0", "#5e5ce6"];
const hue = (name) => HUES[[...name].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) % HUES.length];
const ORD = ["1st", "2nd", "3rd"];
function goofy(name) {
  const h = [...name].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) >>> 0;
  const eyes = [
    '<circle cx="36" cy="42" r="9" fill="#fff"/><circle cx="64" cy="40" r="13" fill="#fff"/><circle cx="38" cy="45" r="4"/><circle cx="60" cy="37" r="4"/>',
    '<path d="M27 44q9-11 18 0M55 44q9-11 18 0" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>',
    '<circle cx="36" cy="42" r="11" fill="#fff"/><circle cx="64" cy="42" r="11" fill="#fff"/><circle cx="41" cy="43" r="4"/><circle cx="59" cy="43" r="4"/>',
    '<rect x="20" y="34" width="60" height="15" rx="6"/><rect x="26" y="38" width="9" height="3" rx="1.5" fill="#fff"/><rect x="56" y="38" width="9" height="3" rx="1.5" fill="#fff"/>',
  ];
  const mouths = [
    '<path d="M33 62q17 18 34 0z"/><path d="M44 69q6 13 12 0z" fill="#ff6b81"/>',
    '<path d="M36 72q14-11 28 0" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>',
    '<ellipse cx="50" cy="69" rx="7" ry="9"/>',
    '<path d="M32 65h36" stroke="#000" stroke-width="4" stroke-linecap="round"/><rect x="45" y="65" width="7" height="8" fill="#fff" stroke="#000" stroke-width="1.5"/>',
  ];
  return '<svg viewBox="0 0 100 100" aria-hidden="true">' + eyes[h % 4] + mouths[(h >> 3) % 4] + "</svg>";
}
const CROWN = '<svg class="prop crown" viewBox="0 0 60 40" aria-hidden="true"><path d="M4 36L2 10l14 12L30 2l14 20 14-12-2 26z" fill="#ffd60a" stroke="#b8860b" stroke-width="2" stroke-linejoin="round"/><circle cx="30" cy="27" r="3.5" fill="#ff375f"/></svg>';
const CONE = '<svg class="prop cone" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 2L52 56H8z" fill="#fff" stroke="#1c1c1e" stroke-width="2.5" stroke-linejoin="round"/><text x="30" y="46" text-anchor="middle" font-family="system-ui" font-weight="800" font-size="20" fill="#ff3b30">L</text></svg>';
function mug(p, lastPlace) {
  return '<span class="mug' + (lastPlace ? " last" : "") + '" style="--hue:' + hue(p.name) + '"><span class="pic">' + (p.face ? '<img src="' + p.face + '" alt="">' : goofy(p.name)) + "</span>" +
    (p.rank === 1 && p.nickels > 0 ? CROWN : "") + (lastPlace ? CONE + '<i class="nose"></i>' : "") + "</span>";
}


const SHARE = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5v-11M8 7.5l4-4 4 4"/><path d="M7 10.5H6.5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H17"/></svg>';
const seenKey = "nickel.board.seen";
const seen = (() => { try { return JSON.parse(localStorage.getItem(seenKey)); } catch { return null; } })();
const remember = () => { try { localStorage.setItem(seenKey, JSON.stringify({ ranks: Object.fromEntries(B.people.map((p) => [p.name, p.rank])), at: Date.now() })); } catch {} };
const blobs = {};
const cardBlob = (src) => (blobs[src] ??= fetch(src).then((r) => r.blob()));
let active = 0, revealed = false, revealTimer = 0;

function reveal() {
  revealed = true;
  const slide = $("reel").lastElementChild, veil = slide.querySelector(".veil");
  if (!veil) return;
  veil.classList.add("off");
  slide.classList.add("revealed");
  const box = slide.getBoundingClientRect();
  Juice.burst({ x: box.left + box.width / 2, y: box.top + box.height * 0.45, count: 110 });
  Juice.buzz([14, 50, 14, 50, 30]);
  setTimeout(() => veil.remove(), 600);
}

function draw() {
  const moved = Juice.moves(seen?.ranks, B.people), n = B.cards.length;
  $("league").textContent = B.league;
  $("stage").innerHTML = '<div class="reel" id="reel">' + B.cards.map((src, i) => {
    const mv = moved[B.order[i]];
    return '<article class="slide shot"><div class="lift"><img src="' + src + '" alt="' + esc(B.order[i]) + '" loading="' + (i < 2 ? "eager" : "lazy") + '"></div>' +
      (mv ? '<span class="move ' + (mv > 0 ? "up" : "down") + '" aria-label="' + (mv > 0 ? "Up " : "Down ") + Math.abs(mv) + ' since your last visit">' + Juice.arrow(mv > 0 ? "up" : "down") + Math.abs(mv) + "</span>" : "") +
      (i === n - 1 && n > 1 && !revealed ? '<div class="veil">' + CROWN + '<p class="t-display">1st</p><p class="t-label">Swipe to find out</p></div>' : "") + "</article>";
  }).join("") + '</div><div class="dots" id="dots">' + B.cards.map((_, i) => '<i class="' + (i === active ? "on" : "") + '"></i>').join("") + "</div>";
  $("dock").innerHTML = '<div class="acts"><button class="glass primary" id="share" type="button">' + SHARE + 'Share</button><a class="glass secondary" href="/w' + (params.get("theme") ? "?theme=" + params.get("theme") : "") + '">Recap</a></div>' +
    '<p class="t-caption">' + (B.stakes ? "Playing for money: " + esc(B.stakes) + ". Swipe up to the winner." : B.punishment ? "Last place " + esc(B.punishment.split(":")[0]) + ". Swipe up to the winner." : 'Loser first. Swipe up to the winner.') + "</p>";
  $("share").onclick = async () => {
    const name = B.order[active], p = B.people.find((x) => x.name === name);
    const out = await Juice.share({ image: cardBlob(B.cards[active]), name: "nickel-" + name.toLowerCase() + ".png", title: B.league + " leaderboard", text: name + " is " + Juice.ordinal(p.rank) + " of " + B.people.length + " in " + B.league, url: location.origin + "/l" });
    if (out === "shared" || out === "copied") { $("share").innerHTML = SHARE + (out === "shared" ? "Shared" : "Link copied"); Juice.buzz([10]); }
  };
  const reel = $("reel");
  let frame = 0;
  const track = () => {
    frame = 0;
    const mid = reel.scrollLeft + reel.clientWidth / 2, calm = Juice.reduced();
    let best = 0, dist = Infinity;
    [...reel.children].forEach((el, i) => {
      const d = (el.offsetLeft + el.offsetWidth / 2 - mid) / el.offsetWidth;
      if (!calm) { el.style.setProperty("--d", Math.max(-1, Math.min(1, d)).toFixed(3)); el.style.setProperty("--a", Math.min(1, Math.abs(d)).toFixed(3)); }
      if (Math.abs(d) < dist) { dist = Math.abs(d); best = i; }
    });
    if (best !== active) { active = best; Juice.buzz([8]); cardBlob(B.cards[active]); }
    [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i === best));
    clearTimeout(revealTimer);
    if (best === n - 1 && n > 1 && !revealed && dist < 0.06) revealTimer = setTimeout(reveal, 220);
  };
  reel.onscroll = () => { frame ||= requestAnimationFrame(track); };
  track();
}
if (!seen) remember();
addEventListener("pagehide", remember);
document.addEventListener("visibilitychange", () => { if (document.hidden) remember(); });
draw();
setInterval(async () => {
  const next = await (await fetch("/api/leaderboard")).json();
  if (JSON.stringify(next) !== JSON.stringify(B)) { const x = $("reel").scrollLeft; B = next; draw(); $("reel").scrollLeft = x; $("reel").onscroll(); }
}, 5000);
</script>
</body>
</html>
